---
- name: Ensure /etc/sysctl.d/99-forwarding.conf enables ip_forward (Ubuntu 26 only)
  ansible.builtin.copy:
    dest: "{{ sysctl_forward_path }}"
    content: |
      {{ sysctl_forward_name }} = {{ sysctl_forward_value }}
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_facts['os_family'] | default('') == 'Debian'
    - ansible_facts['distribution'] | default('') == 'Ubuntu'
    - ansible_facts['distribution_major_version'] | default('0') == '26'