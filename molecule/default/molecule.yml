---
driver:
  name: docker
platforms:
  - name: ubuntu-26
    image: ubuntu:26.04
    dockerfile: Dockerfile.26
    command: sleep infinity
  - name: ubuntu-24
    image: ubuntu:24.04
    dockerfile: Dockerfile.24
    command: sleep infinity
provisioner:
  name: ansible
  version: native
  playbooks:
    converge: ./converge.yml
  env:
    ANSIBLE_FACT_PACKAGES: []
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: testinfra